<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebTerminal 1.0</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2.5' width='14' height='11' rx='2' fill='%23010409' stroke='%2358a6ff' stroke-width='1.2'/%3E%3Cpath d='M4 6.5 6.5 9 4 11.5' fill='none' stroke='%23e6edf3' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8.5 11.5h3.5' fill='none' stroke='%23e6edf3' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   THEME TOKENS
   All colors/shadows live in CSS variables so themes can be
   swapped simply by flipping data-theme on <body>.
   ============================================================ */
:root {
  --font-mono: ui-monospace, "Cascadia Code", "Consolas", "SF Mono", "JetBrains Mono", "Menlo", monospace;
  --bg: #0d1117;              /* page background behind the frame  */
  --frame-bg: #010409;        /* terminal interior background      */
  --text: #e6edf3;            /* primary text color                */
  --dim: #7d8590;             /* muted / secondary text            */
  --prompt: #2f81f7;          /* prompt symbol + accents (VS Code blue) */
  --accent: #58a6ff;          /* highlights / links                */
  --ok: #3fb950;              /* success / directory color         */
  --warn: #d29922;            /* warnings                          */
  --err: #f85149;             /* errors                            */
  --cyan: #39c5cf;
  --magenta: #bc8cff;
  --cursor: #e6edf3;          /* caret color                       */
  --sel-bg: rgba(56, 139, 253, 0.35);
  --sel-fg: #e6edf3;
  --glow: rgba(88, 166, 255, 0.25);   /* CRT-ish glow               */
  --scan-opacity: 0.05;               /* scanline strength          */
  --vignette-opacity: 0.5;
  --toolbar-bg: #161b22;
  --border: #30363d;
}

/* Green phosphor theme */
body[data-theme="green"] {
  --bg: #050805;
  --frame-bg: #000000;
  --text: #33ff33;
  --dim: #1f7a1f;
  --prompt: #33ff33;
  --accent: #66ff66;
  --ok: #2ecc2e;
  --warn: #d2d242;
  --err: #ff4444;
  --cyan: #33ffcc;
  --magenta: #cc66ff;
  --cursor: #33ff33;
  --glow: rgba(51, 255, 51, 0.22);
  --scan-opacity: 0.09;
  --toolbar-bg: #0a0f0a;
  --border: #1f3d1f;
}

/* Amber phosphor theme */
body[data-theme="amber"] {
  --bg: #0d0800;
  --frame-bg: #000000;
  --text: #ffb000;
  --dim: #7a5800;
  --prompt: #ffb000;
  --accent: #ffcc55;
  --ok: #ffcf7a;
  --warn: #ff9922;
  --err: #ff5544;
  --cyan: #ffd27a;
  --magenta: #ffab45;
  --cursor: #ffb000;
  --glow: rgba(255, 176, 0, 0.22);
  --scan-opacity: 0.09;
  --toolbar-bg: #140e00;
  --border: #5c4400;
}

/* Cyberpunk theme */
body[data-theme="cyberpunk"] {
  --bg: #0a0014;
  --frame-bg: #12002b;
  --text: #f8f3ff;
  --dim: #8a7fb0;
  --prompt: #00f0ff;
  --accent: #ff2ad1;
  --ok: #7bff00;
  --warn: #ffd700;
  --err: #ff0033;
  --cyan: #00f0ff;
  --magenta: #ff2ad1;
  --cursor: #00f0ff;
  --glow: rgba(0, 240, 255, 0.28);
  --scan-opacity: 0.06;
  --toolbar-bg: #1a0b33;
  --border: #3b1f6e;
}

/* Catppuccin Mocha theme */
body[data-theme="catppuccin"] {
  --bg: #11111b;
  --frame-bg: #1e1e2e;
  --text: #cdd6f4;
  --dim: #a6adc8;
  --prompt: #89b4fa;
  --accent: #89b4fa;
  --ok: #a6e3a1;
  --warn: #f9e2af;
  --err: #f38ba8;
  --cyan: #94e2d5;
  --magenta: #cba6f7;
  --cursor: #f5e0dc;
  --sel-bg: rgba(137, 180, 250, 0.35);
  --sel-fg: #cdd6f4;
  --glow: rgba(137, 180, 250, 0.18);
  --scan-opacity: 0.05;
  --toolbar-bg: #313244;
  --border: #45475a;
}

/* ============================================================
   GLOBAL LAYOUT
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-mono);
  background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--bg) 70%, #000), var(--bg) 75%);
  color: var(--text);
  display: flex;
  flex-direction: column;
  padding: 12px;
  transition: background 0.3s ease;
}

/* Full-window canvas for the Matrix rain effect (hidden by default) */
#matrix-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
body.matrix #matrix-canvas { opacity: 1; }
body.matrix .terminal-frame { background: rgba(0, 0, 0, 0.82); }
body.matrix { background: #000; }

/* CRT scanlines + vignette overlay, non-interactive */
.crt-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
}
.crt-overlay .scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.03) 0px,
    rgba(255, 255, 255, 0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: var(--scan-opacity);
}
.crt-overlay .vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
  opacity: var(--vignette-opacity);
}

/* ============================================================
   TERMINAL FRAME
   ============================================================ */
.terminal-frame {
  position: relative;
  z-index: 10;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  background: var(--frame-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.02),
    0 0 40px var(--glow),
    0 30px 60px rgba(0, 0, 0, 0.6),
    inset 0 0 80px rgba(0, 0, 0, 0.35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: box-shadow 0.3s ease, background 0.3s ease;
}

/* -------- Tiling terminal host -------- */
#host-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--toolbar-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  user-select: none;
}
#host-toolbar .title {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.5px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#host-toolbar button {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 12px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
#host-toolbar button:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(255, 255, 255, 0.03);
}
.host-icon {
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  color: var(--accent);
}
#workspace {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  overflow: auto;
  align-items: stretch;
}
.term-panel {
  position: relative;
  flex: 1 1 100%;
  min-width: 340px;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}
body.multi .term-panel { flex: 1 1 0; min-width: 300px; min-height: 0; }
.term-panel .panel-close {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 30;
  width: 22px;
  height: 22px;
  line-height: 20px;
  text-align: center;
  border-radius: 5px;
  color: var(--dim);
  background: color-mix(in srgb, var(--toolbar-bg) 85%, transparent);
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
  user-select: none;
}
.term-panel .panel-close:hover { color: var(--err); border-color: var(--err); }
.term-iframe {
  display: block;
  flex: 1 1 auto;
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 0;
  background: var(--frame-bg);
}
/* Embedded terminals (inside an iframe) show no host chrome and fill
   the iframe flush, matching the inline first terminal's size. */
body.embedded { padding: 0; }
body.embedded #host-toolbar { display: none; }
body.embedded #workspace { padding: 0; gap: 0; overflow: hidden; }
body.embedded .term-panel { min-width: 0; min-height: 0; }
body.embedded .panel-close { display: none; }

/* -------- Toolbar -------- */
.toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  user-select: none;
  flex-wrap: wrap;
}
.toolbar .dots { display: flex; gap: 7px; }
.toolbar .dot { width: 11px; height: 11px; border-radius: 50%; }
.toolbar .dot.r { background: #ff5f57; }
.toolbar .dot.y { background: #febc2e; }
.toolbar .dot.g { background: #28c840; }
.toolbar .title {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.5px;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toolbar .controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.toolbar label { font-size: 11px; color: var(--dim); }
.toolbar select {
  font-family: var(--font-mono);
  font-size: 11px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 7px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.toolbar select:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(255, 255, 255, 0.03);
}
.toolbar select option { background: var(--toolbar-bg); color: var(--text); }

/* -------- Output area -------- */
#output {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 16px 6px;
  font-size: var(--fs, 14px);
  line-height: 1.55;
  word-break: break-word;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#output::-webkit-scrollbar { width: 9px; }
#output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
#output::-webkit-scrollbar-track { background: transparent; }

/* Each printed line is a <pre>; keeps spacing & prevents wraps */
#output pre {
  margin: 0;
  white-space: pre-wrap;
  font-family: var(--font-mono);
  font-size: inherit;
  line-height: inherit;
  color: var(--text);
}

/* Colored variants */
#output pre.dim     { color: var(--dim); }
#output pre.err     { color: var(--err); }
#output pre.ok      { color: var(--ok); }
#output pre.warn    { color: var(--warn); }
#output pre.accent  { color: var(--accent); }
#output pre.cyan    { color: var(--cyan); }
#output pre.magenta { color: var(--magenta); }
#output pre.prompt  { color: var(--prompt); }
#output pre.title   {
  color: var(--accent);
  font-weight: bold;
  text-shadow: 0 0 8px var(--glow);
}

/* -------- Input line -------- */
#input-line {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px 14px;
  background: linear-gradient(to top, var(--frame-bg), color-mix(in srgb, var(--frame-bg) 94%, var(--accent) 6%));
  border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  font-size: var(--fs, 14px);
}
#input-line .prompt {
  color: var(--prompt);
  font-weight: bold;
  flex: 0 0 auto;
  margin-left: -8px;           /* cancel the flex gap so the path and $ join: ~$, ~/docs$ */
  text-shadow: 0 0 6px var(--glow);
}
#input-line .cwd-hint {
  color: var(--ok);
  flex: 0 0 auto;
  white-space: nowrap;
  opacity: 0.85;
}

/* The real input is transparent; text shows on the plain input background */
#command-input {
  flex: 1 1 auto;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: inherit;
  padding: 0;
  caret-color: var(--cursor);
  animation: caret-blink 1.06s steps(1) infinite;
}
@keyframes caret-blink { 0%, 100% { caret-color: var(--cursor); } 50% { caret-color: transparent; } }

#command-input::selection { background: var(--sel-bg); color: var(--sel-fg); }

/* -------- nano / vim editor overlay -------- */
#editor-overlay {
  display: none;
  flex: 1 1 auto;
  flex-direction: row;
  min-height: 220px;
  margin: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: color-mix(in srgb, var(--frame-bg) 96%, #fff 4%);
}
#editor-overlay.active { display: flex; }
#editor-gutter {
  flex: 0 0 auto;
  min-width: 40px;
  overflow: hidden;
  padding: 8px 8px 8px 4px;
  text-align: right;
  color: var(--dim);
  font-size: 13px;
  line-height: 1.6;
  white-space: pre;
  background: color-mix(in srgb, var(--frame-bg) 92%, #000 8%);
  border-right: 1px solid var(--border);
  user-select: none;
}
#editor-buffer {
  flex: 1 1 auto;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  padding: 8px 10px;
  white-space: pre;
  overflow: auto;
  caret-color: var(--cursor);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#editor-buffer.readonly { color: var(--dim); }
#editor-status {
  flex: 0 0 auto;
  padding: 6px 16px;
  font-size: 12px;
  color: var(--accent);
  border-top: 1px solid var(--border);
  background: var(--toolbar-bg);
  display: none;
  align-items: center;
  gap: 10px;
}
#editor-status.active { display: flex; }
#vim-cmd {
  flex: 1 1 auto;
  min-width: 120px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
  caret-color: var(--cursor);
}

/* Visually hidden live region: the fast-scrolling #output stream keeps
   aria-live="off" so screen readers don't announce every line; results
   are funneled into this throttled polite region instead. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* -------- Responsive --------
   Fullscreen/no-radius mode only for the host page. Embedded iframe
   tiles can be narrower than 640px; they must keep the rounded frame
   so they match the inline first terminal. */
@media (max-width: 640px) {
  body:not(.embedded) { padding: 0; }
  body:not(.embedded) .terminal-frame { border-radius: 0; height: 100%; width: 100%; }
  body:not(.embedded) .toolbar .title { display: none; }
  body:not(.embedded) #output { padding: 10px 10px 4px; }
}
</style>
</head>
<body data-theme="vs">

<canvas id="matrix-canvas"></canvas>

<!-- Tiling host toolbar -->
<header id="host-toolbar">
  <div class="dots" aria-hidden="true">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
  </div>
  <svg class="host-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
    <rect x="1" y="2.5" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <path d="M4 6.5 6.5 9 4 11.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.5 11.5h3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <div class="title">WebTerminal — tiling host</div>
  <button type="button" id="new-terminal-btn" aria-label="Open a new terminal">+ terminal</button>
</header>

<div id="workspace">
  <div class="term-panel" id="panel-0">
    <section class="terminal-frame" id="terminal-frame">
      <header class="toolbar">
        <div class="dots" aria-hidden="true">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        </div>
        <div class="title">user@localhost: ~ — WebTerminal 1.0</div>
      </header>

      <!-- Scrollable output (off: announcing every scrolled line would flood a screen reader) -->
      <main id="output" aria-live="off"></main>
      <div id="sr-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

      <!-- nano editor (hidden until `nano` is invoked) -->
      <section id="editor-overlay" aria-label="nano text editor">
        <div id="editor-gutter"></div>
        <textarea id="editor-buffer" spellcheck="false" autocomplete="off"></textarea>
      </section>
      <div id="editor-status"><span id="editor-status-text"></span><input id="vim-cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="vim command" /></div>

      <!-- Fixed input line -->
      <footer id="input-line">
        <span class="cwd-hint" id="cwd-hint">~</span>
        <span class="prompt" id="prompt-span" aria-hidden="true">$</span>
        <input id="command-input" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               aria-label="Terminal command" />
      </footer>
    </section>
  </div>
</div>

<div class="crt-overlay" aria-hidden="true">
  <div class="scanlines"></div>
  <div class="vignette"></div>
</div>

<script>
/* =====================================================================
   WebTerminal 1.0 — a self-contained terminal emulator.
   No external dependencies; runs offline in any modern browser.
   ===================================================================== */
(function () {
  "use strict";

  /* ---------------------------------------------------------------
   * DOM references
   * ------------------------------------------------------------- */
  var outputEl     = document.getElementById("output");
  var inputEl      = document.getElementById("command-input");
  var inputLineEl  = document.getElementById("input-line");
  var cwdHintEl    = document.getElementById("cwd-hint");
  var themeSelect  = document.getElementById("theme-select");
  var fontSelect   = document.getElementById("font-select");
  var matrixCanvas = document.getElementById("matrix-canvas");
  var editorOv     = document.getElementById("editor-overlay");
  var editorBuf    = document.getElementById("editor-buffer");
  var editorGut    = document.getElementById("editor-gutter");
  var editorStatus = document.getElementById("editor-status");
  var editorStatusText = document.getElementById("editor-status-text");
  var vimCmd       = document.getElementById("vim-cmd");
  var promptSpan   = document.getElementById("prompt-span");
  var workspaceEl  = document.getElementById("workspace");
  var newTermBtn   = document.getElementById("new-terminal-btn");

  /* ---------------------------------------------------------------
   * Global state
   * ------------------------------------------------------------- */
  var USER = "user", HOST = "localhost";          // static identity
  var history = [];                                // executed commands
  var historyIndex = 0;                            // up/down navigation
  var historyDraft = "";                           // unsaved typed text
  var cwd = ["home", "user"];                  // simulated cwd as path
  var editing = null;                              // nano/vim state
  var matrixRunning = false;
  var replActive = false;                          // Python REPL mode
  var pyRepl = null;                               // { lines: [...] }
  var pyodideLoading = false;                      // Pyodide load in progress
  var pyWaiters = [];                              // callbacks waiting for Pyodide
  var FS_KEY = "webterm_fs_v5";                    // localStorage key

  /* ---------------------------------------------------------------
   * Simulated file system.
   * A directory is {files:{...}, dirs:{...}}; a file is a string.
   * ------------------------------------------------------------- */
  // Bare system: starts with just a home directory containing the
  // always-present ~/pers folder plus a default ~/.bashrc template
  // (commented examples + a couple of active samples) so `nano
  // .bashrc`, `export`, and `alias` work from a fresh boot.
  // Everything else only exists after you create it.
  // The root node is { dirs: {...}, files: {...} }.
  var fs = { dirs: {
    home: { dirs: {
      user: { dirs: { pers: { dirs: {}, files: {} } }, files: {
        ".bashrc": [
          "# WebTerminal config — exports and aliases are applied at boot",
          "# Edit this file (nano .bashrc) or use the `export` / `alias` commands.",
          "# Uncomment a sample below to enable it.",
          "",
          "# ---- Sample exports (uncomment to enable) ----",
          "# export EDITOR=nano",
          "# export LANG=en_US.UTF-8",
          "",
          "# ---- Sample aliases (uncomment to enable) ----",
          "# alias la='ls -a'",
          "# alias c='clear'",
          "",
          "# ---- Active sample config ----",
          "export EDITOR=nano",
          "alias ll='ls -l'"
        ].join("\n") + "\n"
      } }
    }, files: {} }
  }, files: {} };

  /* ---- filesystem persistence ------------------------------------
   * The whole simulated FS is JSON-serialized to localStorage so edits
   * (nano/vim, touch, mkdir, curl -o …) survive a page reload.
   * ---------------------------------------------------------------- */
  var fsInitial = JSON.parse(JSON.stringify(fs));

  function saveFs() {
    broadcast("fs", JSON.stringify(fs));
  }
  function loadFs() {
    try {
      var raw = localStorage.getItem(FS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.dirs) fs = parsed;
      }
    } catch (e) { /* ignore corrupt storage */ }
  }

  /* ---- cross-terminal live sync -----------------------------------
   * Every terminal shares one FS plus one theme/font. When any of them
   * mutates state it writes localStorage (persistence + separate tabs)
   * AND postMessages the payload to sibling tiles + the parent page so
   * every open terminal updates instantly. Receivers apply silently and
   * never re-broadcast, which keeps the relays acyclic.
   * ---------------------------------------------------------------- */
  var THEME_KEY = "webterm_theme";
  var FONT_KEY  = "webterm_font";

  function postFrames(kind, payload) {
    if (!document.querySelectorAll) return;

  /* Real-ish ping: the browser can't send ICMP, but it CAN measure the

      for (var i = 0; i < args.length; i++) {
        if (args[i] === "-c" && args[i + 1]) { count = parseInt(args[i + 1], 10) || 4; i++; }
        else if (args[i].charAt(0) !== "-") hostArg = args[i];

      var host = String(hostArg).replace(/^https?:\/\//, "").replace(/\/.*$/, "");

  function writePyNode(node, pypath) {
    var py = window.pyodide, FS = py.FS;
    try { FS.mkdir(pypath); } catch (e) {}
    Object.keys(node.dirs || {}).forEach(function (name) {
      writePyNode(node.dirs[name], pypath + "/" + name);
    });
    Object.keys(node.files || {}).forEach(function (name) {
      var p = pypath + "/" + name;
      try { FS.unlink(p); } catch (e) {}
      try { FS.writeFile(p, node.files[name]); } catch (e) {
        print("python: fs write " + p + ": " + e.message, "warn");
      }
    });
  }

  function readPyNode(node, pypath) {
    var py = window.pyodide, FS = py.FS, entries;
    try { entries = FS.readdir(pypath); } catch (e) { return node; }
    entries.forEach(function (name) {
      if (name === "." || name === "..") return;
      var p = pypath + "/" + name, st;
      try { st = FS.stat(p); } catch (e) { return; }
      if (FS.isDir(st.mode)) {
        node.dirs[name] = readPyNode({ dirs: {}, files: {} }, p);
      } else {
        try { node.files[name] = FS.readFile(p, { encoding: "utf8" }); } catch (e) {}
      }
    });
    return node;
  }

   * nano & vim — minimal text editor simulations

   * modal (INSERT / NORMAL / command-line). Files are written straight

   * =================================================================== */
  function openEditor(mode, args) {
    var name = args[0];
    if (!name) { print("usage: " + mode + " <file>", "warn"); return; }
    var target = expandPath(name);
    var parent = resolveDir(target.slice(0, -1));
    var fname = target[target.length - 1];
    if (!parent.node) { print(mode + ": no such directory", "err"); return; }
    var content = parent.node.files[fname] || "";
    editing = {
      name: pathDisplay(target),
      path: target,
      fname: fname,
      modified: false,
      mode: mode,              // "nano" | "vim"
      insert: mode === "vim",  // vim starts in insert mode
      command: false,          // vim command-line open
      pendingD: false          // vim "d" key held for dd
    };
    editorBuf.value = content;
    editorBuf.readOnly = false;
    editorBuf.classList.remove("readonly");
    enterEditor();
  }

  function matrixResize() {
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;

      startMatrix();
    } else if (matrixResizeBound) {
      matrixResizeBound = false;
      if (window.removeEventListener) window.removeEventListener("resize", matrixResize);
    }
    print("matrix: " + (on ? "on" : "off"));
  }
  function startMatrix() {
    var chars = "アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF";
    var fontSize = 14;
    matrixResize();
    (function draw() {
      if (!matrixRunning) { matrixCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height); return; }
      matrixCtx.fillStyle = "rgba(0,0,0,0.05)";
      matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      matrixCtx.fillStyle = "#00ff41";
      matrixCtx.font = fontSize + "px monospace";
      for (var i = 0; i < matrixDrops.length; i++) {
        var ch = chars[Math.floor(Math.random() * chars.length)];
        matrixCtx.fillText(ch, i * fontSize, matrixDrops[i] * fontSize);
        if (matrixDrops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
        matrixDrops[i]++;
      }
      requestAnimationFrame(draw);
    })();
  }

  /* =====================================================================
   * Theme / font application
   * =================================================================== */
  var currentTheme = "vs";
  var currentFont  = 14;
  function setThemeSilent(t) {
    document.body.setAttribute("data-theme", t);
    currentTheme = t;
    if (themeSelect) themeSelect.value = t;
  }
  function applyTheme(t) {
    setThemeSilent(t);
    broadcast("theme", t);
  }
  function setFontSilent(px) {
    document.body.style.setProperty("--fs", px + "px");
    currentFont = px;
    if (fontSelect) fontSelect.value = String(px);
  }
  function applyFont(px) {
    setFontSilent(px);
    broadcast("font", px);
  }

  /* =====================================================================
   * Welcome banner
   * =================================================================== */
  function showBanner(typed) {
    var d = now();
    var lines = [
      "Welcome to WebTerminal v1.0",
      "Type 'help' for available commands",
      "═".repeat(46),
      "Last login: " + dateStr(d) + " " + timeStr(d) + " from 127.0.0.1",
      "User: " + USER + "@" + HOST,
      "System: WebTerminal 1.0 (browser-based, vanilla JS)",
      "─".repeat(46)
    ];
    if (typed) {
      lines.forEach(function (l, i) { print(l, i === 0 ? "title" : i === 2 || i === 6 ? "dim" : ""); });
    } else {
      // gentle typewriter on first load
      typewriteText(lines.join("\n"), "", 16, function () {});
    }
  }

  /* =====================================================================
   * Input handling
   * =================================================================== */
  inputEl.addEventListener("keydown", function (e) {
    var key = e.key;

    /* Ctrl+L → clear screen */
    if (e.ctrlKey && key.toLowerCase() === "l") {
      e.preventDefault();
      clearScreen();
      return;
    }

    /* Python REPL mode: Ctrl+D quits, Ctrl+C interrupts, Enter runs code */
    if (replActive) {
      if (e.ctrlKey && key.toLowerCase() === "d") {
        e.preventDefault();
        exitPythonRepl();
        return;
      }
      if (e.ctrlKey && key.toLowerCase() === "c") {
        e.preventDefault();
        print("^C", "dim");
        pyRepl.lines = [];
        inputEl.value = "";
        setReplPrompt();
        return;
      }
      if (key === "Tab") { e.preventDefault(); return; }
      if (key === "Enter") {
        e.preventDefault();
        handlePythonLine(inputEl.value);
        return;
      }
      /* other keys (arrows, paste, editing) fall through to shared code */
    }

    /* Ctrl+C → interrupt */
    if (e.ctrlKey && key.toLowerCase() === "c") {
      e.preventDefault();
      print("^C", "dim");
      inputEl.value = "";
      return;
    }

    /* Ctrl+V handled by browser paste (fine for us) */
    if (e.ctrlKey && key.toLowerCase() === "v") return;

    /* Tab → autocomplete */
    if (key === "Tab") {
      e.preventDefault();
      autocomplete();
      return;
    }

    /* ArrowUp / ArrowDown → history navigation */
    if (key === "ArrowUp") {
      e.preventDefault();
      if (history.length === 0) return;
      if (historyIndex === 0) historyDraft = inputEl.value;
      if (historyIndex < history.length) historyIndex++;
      inputEl.value = history[history.length - historyIndex];
      moveCaretEnd();
      return;
    }
    if (key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        inputEl.value = historyIndex === 0 ? historyDraft : history[history.length - historyIndex];
        moveCaretEnd();
      }
      return;
    }

    /* Enter → execute */
    if (key === "Enter") {
      e.preventDefault();
      runCommand(inputEl.value);
      inputEl.value = "";      // clear the line once it has been sent
      historyIndex = 0;
      return;
    }
  });

  function moveCaretEnd() {
    var len = inputEl.value.length;
    inputEl.setSelectionRange(len, len);
  }

  /* Tap anywhere to focus input — but NOT on the toolbar or its
     controls, otherwise <select> dropdowns open and instantly close. */
  document.addEventListener("click", function (e) {
    if (editing) return;
    var t = e.target;
    if (t && (t.closest(".toolbar") || t.tagName === "SELECT" || t.tagName === "BUTTON")) return;
    inputEl.focus();
  });
  inputLineEl.addEventListener("mousedown", function (e) { e.preventDefault(); inputEl.focus(); });

  /* ---------------------------------------------------------------
   * Command execution pipeline
   * ------------------------------------------------------------- */
  /* Tokenize a command string into args (quote-aware). */
  /* Split a command line into args. Quotes may sit mid-word (alias x='a b').
     Double-quoted and bare text get $VAR expansion; single-quoted text is literal. */
  function splitArgsText(text) {
    var args = [], buf = "", expandable = false, quoted = false, inQuote = null, i = 0, n = text.length;
    function flush() {
      if (buf !== "" || quoted) args.push(expandable ? expandVars(buf) : buf);
      buf = ""; expandable = false; quoted = false;
    }
    while (i < n) {
      var ch = text[i];
      if (inQuote) {
        if (ch === inQuote) inQuote = null;
        else { buf += ch; if (inQuote === '"') expandable = true; }
        i++;
        continue;
      }
      if (ch === '"' || ch === "'") { inQuote = ch; quoted = true; i++; continue; }
      if (ch === " " || ch === "\t") { flush(); i++; continue; }
      buf += ch;
      expandable = true;
      i++;
    }
    flush();
    return args;
  }

  /* Split a raw line on top-level shell operators, honouring quotes:
     && ; | > >> are returned as operator tokens, everything else as text. */
  function shellTokenize(raw) {
    var tokens = [], buf = "", i = 0, n = raw.length;
    function flush() { var t = buf.trim(); buf = ""; if (t) tokens.push({ type: "text", value: t }); }
    while (i < n) {
      var ch = raw[i];
      if (ch === '"' || ch === "'") {
        var quote = ch, j = i + 1;
        while (j < n && raw[j] !== quote) j++;
        var end = (j < n) ? j + 1 : n;
        buf += raw.slice(i, end);
        i = end;
        continue;
      }
      if (ch === "&" && raw[i + 1] === "&") { flush(); tokens.push({ type: "and" }); i += 2; continue; }
      if (ch === "|") { flush(); tokens.push({ type: "pipe" }); i += 1; continue; }
      if (ch === ";") { flush(); tokens.push({ type: "semi" }); i += 1; continue; }
      if (ch === ">" && raw[i + 1] === ">") { flush(); tokens.push({ type: "append" }); i += 2; continue; }
      if (ch === ">") { flush(); tokens.push({ type: "redir" }); i += 1; continue; }
      buf += ch; i++;
    }
    flush();
    return tokens;
  }

  function runChainSegment(text, stdinText, capture) {
    var captured = null;
    if (capture) outCapture = { lines: [] };
    if (text) {
      var args = resolveAliases(splitArgsText(text));
      var cmdName = args.shift();
      if (envOptions.xtrace) printDom("$ " + text, "dim");
      var cmd = commands[cmdName];
      if (cmd && cmd.fn) {
        cmd.fn(args, stdinText);
      } else {
        print(cmdName + ": command not found", "err");
        var sug = closestCommand(cmdName);
        if (sug) print("Did you mean: " + sug + "?", "warn");
      }
    }
    if (capture) { captured = outCapture ? outCapture.lines : []; outCapture = null; }
    return captured;
  }

  /* Write captured stdout lines to a file (cmd > file) or append (cmd >> file). */
  function writeRedirect(filePath, lines, append) {
    var target = expandPath(filePath);
    var parent = resolveDir(target.slice(0, -1));
    var name = target[target.length - 1];
    if (!parent.node || !name) { print((append ? ">>" : ">") + ": cannot write to '" + filePath + "'", "err"); return; }
    if (parent.node.dirs && parent.node.dirs[name]) { print((append ? ">>" : ">") + ": " + name + ": Is a directory", "err"); return; }
    var content = lines.join("\n");
    if (content) content += "\n";
    var prev = "";
    if (append && parent.node.files && Object.prototype.hasOwnProperty.call(parent.node.files, name)) {
      prev = parent.node.files[name];
    }
    parent.node.files[name] = prev + content;
    saveFs();
    print((append ? "Appended" : "Wrote") + " " + pathDisplay(target) + " (" + parent.node.files[name].length + " bytes)", "ok");
  }

  /* Execute a command line honoring shell operators; used by time/watch/xargs/
     sudo. No echo/history side effects — the outer caller owns those. */
  function runCommandText(text, stdinText) {
    if (!runChain(text, true)) runChainSegment(text, stdinText, false);
  }

  function runChain(raw, silent) {
    var tokens = shellTokenize(raw);
    var hasOp = tokens.some(function (t) { return t.type !== "text"; });
    if (!hasOp) return false;

    if (!silent) {
      echoPrompt(raw);
      history.push(raw);
      historyIndex = 0;
      historyDraft = "";
    }
    var i = 0, current = "", pipeText = null;
    while (i < tokens.length) {
      var t = tokens[i];
      if (t.type === "text") { current += (current ? " " : "") + t.value; }
      else if (t.type === "pipe") {
        var cap = runChainSegment(current, pipeText, true) || [];
        pipeText = cap.join("\n") || null;
        current = "";
        if (chainFailed && envOptions.errexit) { chainFailed = false; break; }
      }
      else if (t.type === "semi") {
        runChainSegment(current, pipeText, false);
        pipeText = null;
        current = "";
        if (chainFailed && envOptions.errexit) { chainFailed = false; break; }
        chainFailed = false;
      }
      else if (t.type === "and") {
        runChainSegment(current, pipeText, false);
        pipeText = null;
        current = "";
        if (chainFailed) {
          // errexit does not abort an && list whose failure is not its last
          // command: skip this list but keep going after the next `;`
          while (i + 1 < tokens.length && tokens[i + 1].type !== "semi") i++;
          chainFailed = false;
        }
      }
      else if (t.type === "redir" || t.type === "append") {
        var target = null;
        if (i + 1 < tokens.length && tokens[i + 1].type === "text") {
          target = tokens[i + 1].value;
          i++;
        }
        if (!target) {
          var op = t.type === "append" ? ">>" : ">";
          print(op + ": syntax error: expected a file after '" + op + "'", "err");
          break;   // malformed line: don't treat trailing operators as commands
        }
        var captured = runChainSegment(current, pipeText, true) || [];
        writeRedirect(target, captured, t.type === "append");
        if (chainFailed && envOptions.errexit) { chainFailed = false; break; }
        pipeText = null;
        current = "";
      }
      i++;
    }
    if (current.trim()) runChainSegment(current, pipeText, false);
    return true;
  }

  function runCommand(raw) {
    raw = raw.trim();
    chainFailed = false;
    if (raw === "") { scrollBottom(); return; }

    if (runChain(raw)) { updateCwdHint(); scrollBottom(); return; }

    echoPrompt(raw);
    history.push(raw);
    historyIndex = 0;
    historyDraft = "";
    var args = resolveAliases(splitArgsText(raw));
    var cmdName = args.shift();
    if (envOptions.xtrace) printDom("$ " + raw, "dim");
    var cmd = commands[cmdName];
    if (cmd && cmd.fn) {
      cmd.fn(args);
    } else {
      print(cmdName + ": command not found", "err");
      var sug = closestCommand(cmdName);
      if (sug) print("Did you mean: " + sug + "?", "warn");
    }
    updateCwdHint();
    scrollBottom();
  }

  /* ---------------------------------------------------------------
   * Autocomplete
   * ------------------------------------------------------------- */
  function autocomplete() {
    var text = inputEl.value;
    var words = text.split(" ");
    var partial = words[words.length - 1];
    var candidates = [];

    // If it's the first word → complete commands
    if (words.length === 1) {
      Object.keys(commands).forEach(function (k) {
        if (!commands[k].hidden && k.startsWith(partial)) candidates.push(k);
      });
    } else {
      // Otherwise → complete filesystem paths from cwd
      candidates = fsCandidates(partial);
    }

    if (!candidates.length) return;
    if (candidates.length === 1) {
      var rest = words.slice(0, -1);
      rest.push(candidates[0]);
      var suffix = " ";
      if (words.length > 1 && candidates[0].charAt(candidates[0].length - 1) === "/") suffix = "";
      inputEl.value = rest.join(" ") + suffix;
      moveCaretEnd();
      return;
    }
    // Multiple matches → print them, keep typing
    print(candidates.join("   "));
    echoPrompt(text);
    inputEl.focus();
  }

  function fsCandidates(partial) {
    var out = [];
    var target = cwd;
    var prefix = "";
    if (partial.indexOf("/") >= 0) {
      var parts = partial.split("/");
      prefix = parts.slice(0, -1).join("/") + "/";
      target = expandPath(prefix === "" ? "." : prefix);
    }
    var e = resolveEntry(target);
    if (e.node == null || e.type !== "dir") return out;
    var base = partial.split("/").pop();
    Object.keys(e.node.dirs || {}).forEach(function (n) {
      if (n.startsWith(base)) out.push(prefix + n + "/");
    });
    Object.keys(e.node.files || {}).forEach(function (n) {
      if (n.startsWith(base)) out.push(prefix + n);
    });
    return out;
  }

  /* ---------------------------------------------------------------
   * cwd hint in the prompt bar
   * ------------------------------------------------------------- */
  function updateCwdHint() {
    cwdHintEl.textContent = pathDisplay(cwd).replace(/^\/home\/user(\/|$)/, "~$1");
  }

  /* ---------------------------------------------------------------
   * nano editor keybindings
   * ------------------------------------------------------------- */
  /* -------- editor keybindings (shared by nano & vim) -------- */
  editorBuf.addEventListener("keydown", function (e) {
    var key = e.key;

    /* nano: Ctrl+S save / Ctrl+X exit / Ctrl+G help */
    if (editing.mode === "nano") {
      if (e.ctrlKey && (key === "s" || key === "S")) { e.preventDefault(); saveFile(); renderEditor(); return; }
      if (e.ctrlKey && (key === "x" || key === "X")) { e.preventDefault(); exitEditor(true); return; }
      if (e.ctrlKey && (key === "g" || key === "G")) { e.preventDefault(); printHTML("^G  Get Help  ^X  Exit  ^S  Save", "dim"); return; }
      if (key.length === 1 || key === "Backspace" || key === "Delete" || key === "Enter" || key === "Tab") editing.modified = true;
      setTimeout(renderEditor, 0);
      return;
    }

    /* ---- vim ---- */
    if (e.ctrlKey && (key === "s" || key === "S")) { e.preventDefault(); saveFile(); renderEditor(); return; }
    if (e.ctrlKey && (key === "x" || key === "X")) { e.preventDefault(); exitEditor(true); return; }

    /* Esc → NORMAL mode */
    if (key === "Escape") {
      e.preventDefault();
      editing.insert = false;
      editing.pendingD = false;
      editorBuf.readOnly = true;
      editorBuf.classList.add("readonly");
      renderEditor();
      return;
    }

    if (!editing.insert) {
      e.preventDefault();
      /* i/a → insert (a moves the caret one character right first) */
      if (key === "i" || key === "a") {
        editing.insert = true;
        editorBuf.readOnly = false;
        editorBuf.classList.remove("readonly");
        if (key === "a") {
          var ap = editorBuf.selectionStart || 0;
          if (ap < editorBuf.value.length) editorBuf.setSelectionRange(ap + 1, ap + 1);
        }
        renderEditor();
        editorBuf.focus();
        return;
      }
      /* : → open the vim command line */
      if (key === ":") {
        editing.command = true;
        renderEditor();
        vimCmd.value = ":";
        vimCmd.focus();
        return;
      }
      /* x → delete char under cursor */
      if (key === "x") {
        var pos = editorBuf.selectionStart || 0;
        if (pos < editorBuf.value.length) {
          editorBuf.value = editorBuf.value.slice(0, pos) + editorBuf.value.slice(pos + 1);
          editing.modified = true;
          editorBuf.setSelectionRange(pos, pos);
          renderEditor();
        }
        return;
      }
      /* d d → delete whole line */
      if (key === "d" && !editing.pendingD) { editing.pendingD = true; return; }
      if (key === "d" && editing.pendingD) {
        editing.pendingD = false;
        var v = editorBuf.value, p = editorBuf.selectionStart || 0;
        var ls = v.lastIndexOf("\n", p - 1) + 1;
        var le = v.indexOf("\n", p);
        var leIdx = le === -1 ? v.length : le;
        editorBuf.value = v.slice(0, ls) + v.slice(le === -1 ? leIdx : leIdx + 1);
        editing.modified = true;
        editorBuf.setSelectionRange(ls, ls);
        renderEditor();
        return;
      }
      editing.pendingD = false;
      if (key !== "Shift" && key.length === 1) print("vim: '" + key + "' not implemented in NORMAL mode (i=insert, :=command)", "warn");
      return;
    }

    /* vim INSERT mode: any real edit marks the buffer modified */
    if (key.length === 1 || key === "Backspace" || key === "Delete" || key === "Enter" || key === "Tab") editing.modified = true;
    setTimeout(renderEditor, 0);
  });

  /* Keep the line-number gutter in sync when the buffer scrolls */
  editorBuf.addEventListener("scroll", function () {
    editorGut.scrollTop = editorBuf.scrollTop;
  });

  /* -------- vim command line (the ":" prompt) -------- */
  vimCmd.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      e.preventDefault();
      editing.command = false;
      editorBuf.readOnly = true;
      renderEditor();
      editorBuf.focus();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      var cmd = vimCmd.value.replace(/^:/, "").trim();
      editing.command = false;
      if (cmd === "w" || cmd === "w!") {
        saveFile();
      } else if (cmd === "q") {
        if (editing.modified) { print("E37: No write since last change (use :q!)", "warn"); }
        else { exitEditor(false); return; }
      } else if (cmd === "wq" || cmd === "x") {
        saveFile(); exitEditor(false); return;
      } else if (cmd === "q!") {
        exitEditor(false); return;
      } else {
        print("E492: Not an editor command: " + cmd, "err");
      }
      renderEditor();
      editorBuf.focus();
    }
  });

  /* ---------------------------------------------------------------
   * Toolbar controls (the theme/font pickers were removed from the
   * toolbar — use the `theme` / `font` commands instead)
   * ------------------------------------------------------------- */
  if (themeSelect) themeSelect.addEventListener("change", function () { applyTheme(themeSelect.value); });
  if (fontSelect) fontSelect.addEventListener("change", function () { applyFont(parseInt(fontSelect.value, 10)); });

  /* ---------------------------------------------------------------
   * Tiling terminal host
   * The first terminal is rendered directly on the page. "+ terminal"
   * spawns real iframe terminals of this same file — they share the
   * FS and ~/.bashrc config through localStorage and tile in the
   * workspace. An iframe URL carries ?term=N, which the app detects
   * as "embedded" mode (host chrome hidden, terminal fills the frame).
   * ------------------------------------------------------------- */
  var termSeq      = 1;
  var embeddedTerm = /[?&]term=/.test(String(location.search || ""));
  if (embeddedTerm) document.body.classList.add("embedded");

  function updateLayout() {
    var panels = [];
    if (workspaceEl && workspaceEl.children) {
      for (var i = 0; i < workspaceEl.children.length; i++) panels.push(workspaceEl.children[i]);
    }
    panels = panels.filter(function (p) { return p.classList && p.classList.contains && p.classList.contains("term-panel"); });
    document.body.classList.toggle("multi", panels.length > 1);
    panels.forEach(function (p) {
      var x = p.querySelector ? p.querySelector(".panel-close") : null;
      if (x) x.style.display = panels.length > 1 ? "" : "none";
    });
  }

  function closePanel(panel) {
    var panels = [];
    if (workspaceEl && workspaceEl.children) {
      for (var i = 0; i < workspaceEl.children.length; i++) panels.push(workspaceEl.children[i]);
    }
    panels = panels.filter(function (p) { return p.classList && p.classList.contains && p.classList.contains("term-panel"); });
    if (panels.length <= 1) return;              // keep at least one terminal
    if (workspaceEl.removeChild) workspaceEl.removeChild(panel);
    updateLayout();
  }

  function addTerminal() {
    termSeq++;
    var panel = document.createElement("div");
    panel.className = "term-panel";
    var frame = document.createElement("iframe");
    frame.className = "term-iframe";
    frame.title = "WebTerminal " + termSeq;
    var base = String(location.href || "index.html").split(/[?#]/)[0];
    frame.src = base + "?term=" + termSeq;
    panel.appendChild(frame);
    var close = document.createElement("div");
    close.className = "panel-close";
    close.textContent = "×";
    close.title = "Close terminal";
    close.addEventListener("click", function () { closePanel(panel); });
    panel.appendChild(close);
    if (workspaceEl.appendChild) workspaceEl.appendChild(panel);
    updateLayout();
  }

  if (newTermBtn) newTermBtn.addEventListener("click", addTerminal);
  updateLayout();

  /* ---------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------- */
  var savedTheme = null, savedFont = 0;
  try {
    savedTheme = localStorage.getItem(THEME_KEY);
    savedFont = parseInt(localStorage.getItem(FONT_KEY) || "", 10);
  } catch (e) { /* ignore */ }
  applyTheme(/^[a-z0-9-]+$/.test(savedTheme || "") ? savedTheme : "vs");
  applyFont(isFinite(savedFont) && savedFont > 0 && savedFont <= 32 ? savedFont : 14);
  loadFs();
  loadBashrc();
  updateCwdHint();
  showBanner(false);
  inputEl.focus();
})();
</script>
</body>
</html>
